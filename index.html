<!DOCTYPE html>
<html lang="fa">

<head>
<meta charset="UTF-8">
<title>فروشگاه آنلاین</title>

<style>
body {
  padding: 20px 35px;
}

table {
  margin: auto;
}

h1, h5 {
  text-align: center;
}
</style>

</head>

<body dir="rtl" style="background-color: pink;">

<h1>نیلماه شاپ</h1>

<h5>اولین سایت اینترنتی من</h5>

<table border="1">

<caption>مشخصات محصول</caption>

<tr>
<td>برند</td>
<td>قیمت</td>
<td>کد</td>
</tr>

<tr>
<td>نیوبالانس</td>
<td>1900</td>
<td>47899</td>
</tr>

<tr>
<td>جردن</td>
<td>2800</td>
<td>87537</td>
</tr>

<tr>
<td>ترویس</td>
<td>3200</td>
<td>87680</td>
</tr>

</table>

<br>

<img src="1.jpg" title="تصویر محصول" width="50" height="100">

<form action="#" method="post">

<h2>ثبت سفارش</h2>

نام:
<input type="text" name="name">
<br><br>

نام خانوادگی:
<input type="text" name="family">
<br><br>

شماره تلفن:
<input type="tel" name="phone" placeholder="09**_123_4567">

<fieldset>
<legend>انتخاب زمان ارسال</legend>

<input type="radio" name="time" id="time1" value="11-15">
<label for="time1">شنبه ۱۱ تا ۱۵</label>
<br>

<input type="radio" name="time" id="time2" value="16-20">
<label for="time2">شنبه ۱۶ تا ۲۰</label>

</fieldset>

<br>

<select name="city">
<option>تهران</option>
<option>قزوین</option>
<option>شیراز</option>
</select>

<br><br>

<button type="submit">تأیید سفارش</button>

</form>

</body>
</html>
